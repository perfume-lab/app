<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直感スワイプ・香水瓶占い</title>
    <style>
        :root { --accent: #d4af37; --bg: #050505; --card: #1a1a1a; --yes: #44ffaa; --no: #ff4444; }
        body, html { height: 100%; margin: 0; font-family: 'Hiragino Mincho ProN', serif; background: var(--bg); color: #fff; overflow: hidden; }
        .container { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        
        .stage-title { font-size: 0.7rem; letter-spacing: 0.4em; color: var(--accent); margin-bottom: 20px; }
        h2 { font-size: 1.1rem; margin-bottom: 30px; line-height: 1.6; font-weight: normal; }

        /* スワイプカードのエリア */
        .swipe-area { position: relative; width: 280px; height: 380px; margin-bottom: 40px; }
        .swipe-card { 
            position: absolute; width: 100%; height: 100%; background: var(--card); border: 1px solid #333;
            border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: transform 0.4s, opacity 0.4s; touch-action: none;
        }
        .swipe-card img { width: 85%; height: 80%; object-fit: contain; pointer-events: none; }
        
        /* スワイプボタン（直感操作用） */
        .controls { display: flex; gap: 40px; }
        .round-btn { 
            width: 65px; height: 65px; border-radius: 50%; border: 2px solid #333; 
            background: none; color: #fff; font-size: 1.5rem; cursor: pointer; transition: 0.3s;
        }
        .btn-no:hover { border-color: var(--no); color: var(--no); }
        .btn-yes:hover { border-color: var(--yes); color: var(--yes); }

        /* 設問・結果画面 */
        .screen { display: none; width: 100%; max-width: 450px; text-align: center; animation: fadeIn 0.6s; }
        .active { display: block; }
        .btn-q { display: block; width: 100%; padding: 18px; margin: 10px 0; background: var(--card); color: #fff; border: 1px solid #333; cursor: pointer; text-align: left; }
        
        .res-img { width: 180px; margin-bottom: 20px; }
        .main-btn { display: block; background: var(--accent); color: #000; padding: 16px; text-decoration: none; font-weight: bold; margin-top: 20px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <div id="step1" class="screen active">
        <p class="stage-title">STAGE 01: VISUAL</p>
        <h2>直感で「好き」なら右へ、<br>「違う」なら左へ。</h2>
        <div class="swipe-area" id="swipe-container"></div>
        <div class="controls">
            <button class="round-btn btn-no" onclick="handleSwipe(false)">✘</button>
            <button class="round-btn btn-yes" onclick="handleSwipe(true)">✔</button>
        </div>
    </div>

    <div id="step2" class="screen">
        <p class="stage-title">STAGE 02: INNER</p>
        <h2 id="q-text">今のあなたが、<br>心から求めている「空気」は？</h2>
        <div id="q-options"></div>
    </div>

    <div id="result-screen" class="screen">
        <p class="stage-title">THE RESULT</p>
        <div id="res-content"></div>
        <a href="#" id="res-link" target="_blank" class="main-btn">Celesで手に入れる</a>
        <p><a href="javascript:location.reload()" style="color:#555; font-size:0.8rem; text-decoration:none; display:inline-block; margin-top:20px;">最初からやり直す</a></p>
    </div>
</div>

<script>
    const perfumes = [
        { id: 0, name: 'ブルガリ プールオム', img: 'Bvlgari-Pour-Homme-min.png', type: 'clean', quote: '王道の清潔感。', link: 'https://www.celes-perfume.com/product/bvlgari-bvlgari-pour-homme/' },
        { id: 1, name: 'LV イマジナシオン', img: 'Imagination-min-1.png', type: 'luxury', quote: '洗練された知性。', link: 'https://www.celes-perfume.com/product/louis-vuitton-imagination/' },
        { id: 2, name: 'Dior ソヴァージュ', img: 'dior-sauvage-min.png', type: 'power', quote: 'ワイルドな自信。', link: 'https://www.celes-perfume.com/product/dior-sauvage/' },
        { id: 3, name: 'レイジーサンデーモーニング', img: 'replica-lazy-sunday-morning-min.png', type: 'clean', quote: '穏やかな安らぎ。', link: 'https://www.celes-perfume.com/product/maison-margiela-lazy-sunday-morning/' }
    ];

    let likedIds = [];
    let currentCardIndex = perfumes.length - 1;

    // カードの生成（重なり順を制御）
    const container = document.getElementById('swipe-container');
    perfumes.forEach((p, index) => {
        const card = document.createElement('div');
        card.className = 'swipe-card';
        card.id = 'card-' + index;
        card.style.zIndex = index;
        card.innerHTML = `<img src="${p.img}">`;
        container.appendChild(card);
    });

    function handleSwipe(isLike) {
        if (currentCardIndex < 0) return;
        
        const card = document.getElementById('card-' + currentCardIndex);
        if (isLike) {
            likedIds.push(currentCardIndex);
            card.style.transform = 'translateX(200%) rotate(20deg)';
        } else {
            card.style.transform = 'translateX(-200%) rotate(-20deg)';
        }
        card.style.opacity = '0';
        
        currentCardIndex--;

        if (currentCardIndex < 0) {
            setTimeout(() => {
                document.getElementById('step1').classList.remove('active');
                showInnerQuiz();
            }, 500);
        }
    }

    function showInnerQuiz() {
        const screen = document.getElementById('step2');
        screen.classList.add('active');
        const optContainer = document.getElementById('q-options');
        const questions = [
            { text: "誰にも邪魔されない、穏やかな安らぎ", type: "clean" },
            { text: "周囲を圧倒する、揺るぎない自信", type: "power" },
            { text: "都会的で洗練された、鋭い感性", type: "luxury" }
        ];
        
        questions.forEach(q => {
            const btn = document.createElement('button');
            btn.className = 'btn-q';
            btn.innerText = q.text;
            btn.onclick = () => finish(q.type);
            optContainer.appendChild(btn);
        });
    }

    function finish(hatedType) {
        document.getElementById('step2').classList.remove('active');
        document.getElementById('result-screen').classList.add('active');
        
        // 好きに選んだものの中から、内面クイズの属性に合うものを優先（なければ好きの1つ目）
        let result = perfumes.find(p => likedIds.includes(p.id) && p.type === hatedType);
        if (!result) result = perfumes[likedIds[0] || 0];

        document.getElementById('res-content').innerHTML = `
            <img src="${result.img}" class="res-img">
            <h2 style="font-size:1.5rem; margin-top:0;">${result.name}</h2>
            <div style="background:#111; padding:20px; border-left:2px solid var(--accent); text-align:left; font-size:0.85rem;">${result.quote}</div>
        `;
        document.getElementById('res-link').href = result.link;
    }
</script>
</body>
</html>
