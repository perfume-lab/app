<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>香水診断Pro - AI精密マッチング</title>
  <style>
    :root {
      --bg: #fdfcf9;
      --accent: #8e8e8e;
      --text: #333d32;
      --bar: #e0e0e0;
      --card: #ffffff;
      --muted: #777;
      --line: #eeeeee;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
    }

    #app {
      background: var(--card);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      text-align: center;
    }

    .progress-container {
      width: 100%;
      height: 6px;
      background: var(--bar);
      margin-bottom: 14px;
      border-radius: 999px;
      overflow: hidden;
    }

    #progress-bar {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 0.25s ease;
    }

    .progress-text {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 18px;
    }

    h1 {
      font-size: 1.25rem;
      margin: 0 0 10px 0;
      color: #1a1a1a;
    }

    h2 {
      font-size: 1.55rem;
      margin: 8px 0 18px 0;
      color: #1a1a1a;
      line-height: 1.5;
    }

    h3 {
      font-size: 1.08rem;
      margin: 0 0 18px 0;
      color: #1a1a1a;
      line-height: 1.7;
      text-align: center;
    }

    .mood-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 10px;
    }

    .mood-card {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      padding: 0;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      text-align: left;
      font-family: inherit;
      color: inherit;
    }

    .mood-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
    }

    .mood-card:active {
      transform: scale(0.99);
    }

    .mood-visual {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: block;
      border: none;
    }

    .mood-body {
      padding: 12px;
    }

    .mood-title {
      display: block;
      font-size: 0.98rem;
      color: #222;
      margin-bottom: 6px;
      font-weight: 700;
      line-height: 1.5;
    }

    .mood-sub {
      display: block;
      font-size: 0.83rem;
      color: #777;
      line-height: 1.6;
    }

    .res-title {
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .main-img {
      width: 100%;
      max-width: 240px;
      margin: 20px auto;
      border-radius: 10px;
      object-fit: cover;
      display: block;
    }

    .type-desc {
      font-size: 0.95rem;
      background: #f9f9f9;
      padding: 18px;
      border-radius: 12px;
      margin: 20px 0;
      text-align: left;
      line-height: 1.9;
    }

    .score-box {
      font-size: 0.88rem;
      background: #fcfcfc;
      border: 1px solid var(--line);
      padding: 14px 16px;
      border-radius: 12px;
      margin: 18px 0 6px 0;
      text-align: left;
      line-height: 1.8;
      color: #444;
    }

    .sub-results {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 22px;
      border-top: 1px solid var(--line);
      padding-top: 22px;
      flex-wrap: wrap;
    }

    .sub-card {
      width: 220px;
      font-size: 0.85rem;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      background: #fff;
      text-align: left;
    }

    .sub-card img {
      width: 100%;
      max-width: 120px;
      height: auto;
      border-radius: 8px;
      margin: 8px auto 10px;
      display: block;
    }

    .quote {
      font-size: 0.82rem;
      line-height: 1.7;
      color: #666;
      text-align: left;
      margin-top: 8px;
    }

    .btn-link {
      display: inline-block;
      padding: 12px 30px;
      background: #333;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      margin-top: 10px;
    }

    .btn-link:hover {
      opacity: 0.9;
    }

    .retry-btn {
      background: none;
      border: none;
      color: #999;
      text-decoration: underline;
      cursor: pointer;
      margin-top: 24px;
      font-size: 0.85rem;
      font-family: inherit;
    }

    .error-box {
      background: #fff8f8;
      border: 1px solid #f0d6d6;
      color: #8a4b4b;
      padding: 16px;
      border-radius: 12px;
      text-align: left;
      line-height: 1.8;
    }

    @media (max-width: 900px) {
      #app {
        padding: 22px;
      }

      .mood-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .mood-card {
        display: flex;
        align-items: stretch;
        min-height: 96px;
        border-radius: 14px;
      }

      .mood-visual {
        width: 88px;
        min-width: 88px;
        aspect-ratio: auto;
        height: auto;
      }

      .mood-body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 12px 14px;
      }

      .mood-title {
        font-size: 1rem;
        margin-bottom: 4px;
      }

      .mood-sub {
        font-size: 0.82rem;
        line-height: 1.5;
      }

      .sub-card {
        width: 100%;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 10px;
      }

      #app {
        padding: 16px 14px 18px;
        border-radius: 14px;
      }

      .progress-text {
        font-size: 0.82rem;
        margin-bottom: 14px;
      }

      h1 {
        font-size: 1.05rem;
        margin-bottom: 8px;
      }

      h3 {
        font-size: 1rem;
        line-height: 1.6;
        margin-bottom: 14px;
      }

      .mood-grid {
        gap: 10px;
      }

      .mood-card {
        min-height: 88px;
        border-radius: 12px;
      }

      .mood-visual {
        width: 72px;
        min-width: 72px;
      }

      .mood-body {
        padding: 10px 12px;
      }

      .mood-title {
        font-size: 0.95rem;
        line-height: 1.45;
      }

      .mood-sub {
        font-size: 0.78rem;
        line-height: 1.45;
      }

      h2 {
        font-size: 1.25rem;
        line-height: 1.5;
      }

      .type-desc {
        font-size: 0.9rem;
        line-height: 1.8;
        padding: 14px;
      }

      .score-box {
        font-size: 0.82rem;
        padding: 12px;
        line-height: 1.7;
      }

      .btn-link {
        width: 100%;
        padding: 13px 16px;
      }

      .main-img {
        max-width: 200px;
      }
    }
  </style>
</head>
<body>
  <div id="app">診断を準備中...</div>

  <script src="data.js"></script>
  <script>
    const QUESTION_COUNT = 10;

    const questionPool = [
      {
        q: "休日の朝、近いのは？",
        opts: [
          { t: "白くて軽い朝", sub: "自然光・清潔感・風", color: "linear-gradient(135deg, #f7f7f2 0%, #dfeee8 100%)", s: { clean: 1.0, b: 0.8, s: 0.5 } },
          { t: "深く静かな朝", sub: "カーテン・静寂・余白", color: "linear-gradient(135deg, #5f6672 0%, #2f3440 100%)", s: { power: 1.0, s: 0.3, d: 0.2 } },
          { t: "上質で特別な朝", sub: "ホテル・柔らかい光・余裕", color: "linear-gradient(135deg, #eadfce 0%, #cbb79d 100%)", s: { luxury: 1.0, s: 0.8, f: 0.6 } }
        ]
      },
      {
        q: "今、惹かれる飲み物は？",
        opts: [
          { t: "ブラックコーヒー", sub: "輪郭・知性・苦み", color: "linear-gradient(135deg, #5d4636 0%, #2a1d16 100%)", s: { power: 1.0, b: 0.2, f: 0.7 } },
          { t: "ミルクティー", sub: "やわらかさ・優雅さ", color: "linear-gradient(135deg, #e8d2b8 0%, #c89d71 100%)", s: { luxury: 1.0, s: 0.9, b: 0.6 } },
          { t: "炭酸水とレモン", sub: "透明感・軽さ・清涼感", color: "linear-gradient(135deg, #e6fbff 0%, #c7f0d8 100%)", s: { clean: 1.0, b: 0.9, d: 0.4 } }
        ]
      },
      {
        q: "惹かれる空間は？",
        opts: [
          { t: "白く静かな部屋", sub: "生成り・余白・整い", color: "linear-gradient(135deg, #fbfaf6 0%, #e9efe6 100%)", s: { clean: 1.0, b: 0.9, f: 0.3 } },
          { t: "クラシックなラウンジ", sub: "ホテル・格・落ち着き", color: "linear-gradient(135deg, #d6c2a8 0%, #8f6d4d 100%)", s: { luxury: 1.0, f: 0.8, d: 0.7 } },
          { t: "無機質な都会空間", sub: "洗練・硬質・モダン", color: "linear-gradient(135deg, #c7ccd4 0%, #6d7480 100%)", s: { power: 1.0, u: 0.7, f: 0.6 } }
        ]
      },
      {
        q: "惹かれる灯りは？",
        opts: [
          { t: "朝の自然光", sub: "透明・軽やか・自然", color: "linear-gradient(135deg, #fffdf0 0%, #f4efca 100%)", s: { clean: 1.0, b: 1.0 } },
          { t: "重厚な間接照明", sub: "深さ・陰影・静けさ", color: "linear-gradient(135deg, #7c675b 0%, #3d2e28 100%)", s: { power: 0.7, luxury: 0.3, d: 0.6 } },
          { t: "華やかなシャンデリア", sub: "きらめき・高揚感・気品", color: "linear-gradient(135deg, #fff1c2 0%, #d7b25a 100%)", s: { luxury: 1.0, b: 0.8, d: 0.8 } }
        ]
      },
      {
        q: "大切にしたい空気感は？",
        opts: [
          { t: "自然体", sub: "気負わない・やさしい", color: "linear-gradient(135deg, #eef6e8 0%, #d0e4c8 100%)", s: { clean: 1.0, s: 0.9 } },
          { t: "気品", sub: "美しさ・格・高揚感", color: "linear-gradient(135deg, #f2e4db 0%, #d1b29f 100%)", s: { luxury: 1.0, f: 0.7, u: 0.4 } },
          { t: "静かな意志", sub: "知性・深さ・芯の強さ", color: "linear-gradient(135deg, #9399a3 0%, #4b505a 100%)", s: { power: 1.0, u: 0.7, d: 0.3 } }
        ]
      },
      {
        q: "理想の夜は？",
        opts: [
          { t: "静かなテラス", sub: "風・余裕・軽やかさ", color: "linear-gradient(135deg, #dfeef4 0%, #9dc8d6 100%)", s: { luxury: 0.7, clean: 0.3, b: 0.5 } },
          { t: "オーセンティックなバー", sub: "影・深み・都会", color: "linear-gradient(135deg, #5e4a42 0%, #231915 100%)", s: { power: 0.8, luxury: 0.2, d: 0.7 } },
          { t: "家で映画", sub: "安心・柔らかさ・オフ", color: "linear-gradient(135deg, #f0ece7 0%, #d9d0c8 100%)", s: { clean: 0.7, s: 1.0 } }
        ]
      },
      {
        q: "本棚に置きたいのは？",
        opts: [
          { t: "写真集や画集", sub: "美しさ・余韻・感性", color: "linear-gradient(135deg, #f1e2d7 0%, #d5b29d 100%)", s: { luxury: 1.0, b: 0.6 } },
          { t: "専門書や哲学書", sub: "知性・構造・深さ", color: "linear-gradient(135deg, #8d939c 0%, #525860 100%)", s: { power: 1.0, u: 0.7, f: 0.8 } },
          { t: "温かなエッセイ", sub: "穏やか・やさしい・自然", color: "linear-gradient(135deg, #f7f4e8 0%, #dce6cd 100%)", s: { clean: 1.0, s: 0.8 } }
        ]
      },
      {
        q: "理想の第一印象は？",
        opts: [
          { t: "清潔感がある", sub: "感じがいい・親しみやすい", color: "linear-gradient(135deg, #f7fbfb 0%, #d9efe8 100%)", s: { clean: 1.0, b: 0.8, s: 0.4 } },
          { t: "上品で目を引く", sub: "華やか・美しい・整っている", color: "linear-gradient(135deg, #f6e5de 0%, #d8b09f 100%)", s: { luxury: 1.0, f: 0.7, d: 0.6 } },
          { t: "静かに印象に残る", sub: "個性・余韻・都会的", color: "linear-gradient(135deg, #c8ccd4 0%, #666d79 100%)", s: { power: 1.0, u: 0.8, d: 0.4 } }
        ]
      },
      {
        q: "写真の雰囲気なら？",
        opts: [
          { t: "朝の光と自然な表情", sub: "透明感・素直さ", color: "linear-gradient(135deg, #fff7ec 0%, #d9f0df 100%)", s: { clean: 1.0, b: 0.9, s: 0.5 } },
          { t: "華やかな一枚", sub: "装い・高揚感・気品", color: "linear-gradient(135deg, #f6ddd3 0%, #dfb09d 100%)", s: { luxury: 1.0, b: 0.6, f: 0.7 } },
          { t: "影が印象的な一枚", sub: "構図・静けさ・個性", color: "linear-gradient(135deg, #858b95 0%, #313742 100%)", s: { power: 1.0, u: 0.9, d: 0.3 } }
        ]
      },
      {
        q: "旅先で惹かれるのは？",
        opts: [
          { t: "海風や石けんの空気", sub: "軽さ・透明感・清涼感", color: "linear-gradient(135deg, #e4fbff 0%, #c7efd8 100%)", s: { clean: 1.0, b: 0.8, d: 0.3 } },
          { t: "格式あるホテル", sub: "特別感・優雅さ・品格", color: "linear-gradient(135deg, #efdfcc 0%, #b9926a 100%)", s: { luxury: 1.0, f: 0.9, s: 0.5 } },
          { t: "路地裏の書店やバー", sub: "静かな個性・深さ", color: "linear-gradient(135deg, #7a8089 0%, #40454f 100%)", s: { power: 1.0, u: 0.7, d: 0.6 } }
        ]
      }
    ];

    const perfumeMetrics = {
      nil:            { b: 0.9, s: 0.6, f: 0.4, u: 0.2, d: 0.5 },
      lazy:           { b: 0.8, s: 0.9, f: 0.2, u: 0.3, d: 0.4 },
      blanche:        { b: 1.0, s: 0.7, f: 0.5, u: 0.2, d: 0.6 },
      tacit:          { b: 0.6, s: 0.4, f: 0.7, u: 0.6, d: 0.4 },
      "212":          { b: 0.7, s: 0.3, f: 0.8, u: 0.4, d: 0.6 },
      "english-pear": { b: 0.8, s: 0.7, f: 0.6, u: 0.3, d: 0.5 },
      teabreak:       { b: 0.7, s: 0.9, f: 0.4, u: 0.4, d: 0.4 },
      parade:         { b: 0.6, s: 0.5, f: 0.9, u: 0.5, d: 0.7 },
      luna:           { b: 0.5, s: 0.6, f: 0.7, u: 0.6, d: 0.5 },
      "lost-cherry":  { b: 0.2, s: 0.4, f: 0.8, u: 0.9, d: 0.9 },
      another13:      { b: 0.4, s: 0.5, f: 0.4, u: 1.0, d: 0.6 },
      gaiac10:        { b: 0.3, s: 0.6, f: 0.6, u: 0.8, d: 0.3 },
      imagination:    { b: 0.7, s: 0.4, f: 0.7, u: 0.7, d: 0.6 }
    };

    const traitMap = {
      clean: ["nil", "lazy", "blanche", "tacit", "212"],
      luxury: ["english-pear", "teabreak", "parade", "luna", "lost-cherry"],
      power: ["another13", "gaiac10", "imagination"]
    };

    const typeDesc = {
      clean:
        "あなたは「強く印象を残す」よりも、「近づいたときに感じる清潔感」や「空気の整った人」という印象を大切にするタイプです。透明感・やわらかさ・軽やかさの傾向が強めに出ています。",
      luxury:
        "あなたは、ただ無難なだけではなく、気品や高揚感、自分を少し美しく見せてくれる空気感を求めるタイプです。華やかさ・上品さ・特別感が強めに出ています。",
      power:
        "あなたは、分かりやすい甘さや親しみやすさよりも、知性・静かな意志・都会的な個性に惹かれるタイプです。モダンさ・輪郭のある印象・少しのクセが魅力として出ています。"
    };

    let currentIdx = 0;
    let sessionQuestions = [];
    let userScores = {};

    function resetScores() {
      userScores = {
        clean: 0,
        luxury: 0,
        power: 0,
        b: 0,
        s: 0,
        f: 0,
        u: 0,
        d: 0
      };
    }

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function safeText(value, fallback = "") {
      return typeof value === "string" && value.trim() ? value : fallback;
    }

    function safeUrl(value, fallback = "#") {
      return typeof value === "string" && value.trim() ? value : fallback;
    }

    function startDiagnosis() {
      resetScores();
      currentIdx = 0;
      const pickCount = Math.min(QUESTION_COUNT, questionPool.length);
      sessionQuestions = shuffle(questionPool).slice(0, pickCount);
      render();
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    function renderMoodVisual(opt) {
      const color = safeText(opt.color, "linear-gradient(135deg, #eeeeee 0%, #cccccc 100%)");
      return `<div class="mood-visual" style="background:${color};"></div>`;
    }

    function render() {
      const app = document.getElementById("app");

      if (!sessionQuestions.length) {
        app.innerHTML = `
          <h1>香水診断Pro</h1>
          <div class="error-box">
            質問データが見つかりません。questionPool を確認してください。
          </div>
        `;
        return;
      }

      const progress = Math.min((currentIdx / sessionQuestions.length) * 100, 100);

      if (currentIdx < sessionQuestions.length) {
        const q = sessionQuestions[currentIdx];
        app.innerHTML = `
          <div class="progress-container">
            <div id="progress-bar" style="width:${progress}%"></div>
          </div>
          <div class="progress-text">Step ${currentIdx + 1} / ${sessionQuestions.length}</div>
          <h1>香水診断Pro</h1>
          <h3>${q.q}</h3>

          <div class="mood-grid">
            ${q.opts.map((o, i) => `
              <button class="mood-card" onclick="nextQuestion(${i})">
                ${renderMoodVisual(o)}
                <div class="mood-body">
                  <span class="mood-title">${o.t}</span>
                  <span class="mood-sub">${safeText(o.sub, "")}</span>
                </div>
              </button>
            `).join("")}
          </div>
        `;
      } else {
        showResult();
      }
    }

    function nextQuestion(optIdx) {
      const selected = sessionQuestions[currentIdx]?.opts?.[optIdx];
      if (!selected || !selected.s) return;

      const scores = selected.s;
      for (const key in scores) {
        if (Object.prototype.hasOwnProperty.call(userScores, key)) {
          userScores[key] += scores[key];
        }
      }

      currentIdx++;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function getDominantTrait() {
      const traits = ["clean", "luxury", "power"];
      let bestTrait = traits[0];

      for (let i = 1; i < traits.length; i++) {
        if (userScores[traits[i]] > userScores[bestTrait]) {
          bestTrait = traits[i];
        }
      }
      return bestTrait;
    }

    function getUserVector(answerCount) {
      const divisor = Math.max(answerCount, 1);
      return {
        b: userScores.b / divisor,
        s: userScores.s / divisor,
        f: userScores.f / divisor,
        u: userScores.u / divisor,
        d: userScores.d / divisor
      };
    }

    function calcDistance(a, b) {
      return Math.sqrt(
        Math.pow(a.b - b.b, 2) +
        Math.pow(a.s - b.s, 2) +
        Math.pow(a.f - b.f, 2) +
        Math.pow(a.u - b.u, 2) +
        Math.pow(a.d - b.d, 2)
      );
    }

    function getCandidatesByTrait(trait) {
      if (typeof masterPerfumes === "undefined" || !Array.isArray(masterPerfumes)) return [];
      const allowedIds = traitMap[trait] || [];
      return masterPerfumes.filter(p => allowedIds.includes(p.id));
    }

    function renderImage(img, alt) {
      const safeImg = safeText(img, "");
      if (!safeImg) return "";
      return `<img src="${safeImg}" alt="${alt}" class="main-img" onerror="this.style.display='none'">`;
    }

    function renderSmallImage(img, alt) {
      const safeImg = safeText(img, "");
      if (!safeImg) return "";
      return `<img src="${safeImg}" alt="${alt}" onerror="this.style.display='none'">`;
    }

    function renderSubCard(item, label) {
      if (!item) return "";

      const name = safeText(item.name, "候補データ");
      const reviewUrl = safeUrl(item.review_url, "#");
      const quote = safeText(item.quote, "");

      return `
        <div class="sub-card">
          <p style="color:#999; font-size:0.72rem;">${label}</p>
          ${renderSmallImage(item.img, name)}
          <p><strong>${name}</strong></p>
          ${quote ? `<div class="quote">${quote}</div>` : ""}
          ${reviewUrl !== "#" ? `<a href="${reviewUrl}" style="color:#333; text-decoration:none;">→ 詳細</a>` : ""}
        </div>
      `;
    }

    function showResult() {
      const app = document.getElementById("app");

      if (typeof masterPerfumes === "undefined" || !Array.isArray(masterPerfumes)) {
        app.innerHTML = `
          <h1>香水診断Pro</h1>
          <div class="error-box">
            data.js の masterPerfumes が見つかりません。読み込みを確認してください。
          </div>
          <button class="retry-btn" onclick="startDiagnosis()">もう一度診断する</button>
        `;
        return;
      }

      const trait = getDominantTrait();
      const userV = getUserVector(currentIdx);
      const candidates = getCandidatesByTrait(trait);

      if (!candidates.length) {
        app.innerHTML = `
          <h1>香水診断Pro</h1>
          <div class="error-box">
            診断候補が見つかりませんでした。data.js 内の id を確認してください。
          </div>
          <button class="retry-btn" onclick="startDiagnosis()">もう一度診断する</button>
        `;
        return;
      }

      const ranked = candidates
        .map(p => {
          const metric = perfumeMetrics[p.id];
          const dist = metric ? calcDistance(userV, metric) : 999;
          return { ...p, dist };
        })
        .sort((a, b) => a.dist - b.dist);

      const best = ranked[0] || null;
      const sub1 = ranked[1] || null;
      const sub2 = ranked[2] || null;

      const traitLabelMap = {
        clean: "CLEAN",
        luxury: "LUXURY",
        power: "POWER"
      };

      const bestName = safeText(best?.name, "おすすめ香水");
      const bestReviewUrl = safeUrl(best?.review_url, "#");
      const bestQuote = safeText(best?.quote, "");

      app.innerHTML = `
        <div class="result-card">
          <div class="res-title">PERFECT MATCH</div>
          <h2>${bestName}</h2>

          ${renderImage(best?.img, bestName)}

          <div class="type-desc">
            <strong>診断結果：${traitLabelMap[trait] || trait.toUpperCase()} タイプ</strong><br><br>
            ${typeDesc[trait] || ""}<br><br>
            ${bestQuote ? `今回の本命は「${bestName}」。<br>“${bestQuote}”` : `今回の本命は「${bestName}」です。`}
          </div>

          <div class="score-box">
            <strong>補助軸の傾向</strong><br>
            明るさ: ${userV.b.toFixed(2)} / やわらかさ: ${userV.s.toFixed(2)} / フォーマル感: ${userV.f.toFixed(2)}<br>
            個性: ${userV.u.toFixed(2)} / 距離感: ${userV.d.toFixed(2)}
          </div>

          ${bestReviewUrl !== "#" ? `<a href="${bestReviewUrl}" class="btn-link">詳細・分析データを読む</a>` : ""}

          ${(sub1 || sub2) ? `
            <div class="sub-results">
              ${renderSubCard(sub1, "OTHER OPTION 01")}
              ${renderSubCard(sub2, "OTHER OPTION 02")}
            </div>
          ` : ""}

          <button class="retry-btn" onclick="startDiagnosis()">別の質問で再診断する</button>
        </div>
      `;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    window.startDiagnosis = startDiagnosis;
    window.nextQuestion = nextQuestion;

    window.onload = () => {
      startDiagnosis();
    };
  </script>
</body>
</html>
