<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香水診断 Pro</title>
    <style>
        :root { --main-bg: #0a0a0a; --accent: #d4af37; --text: #e0e0e0; }
        body { font-family: "Helvetica Neue", Arial, sans-serif; background: var(--main-bg); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        #app { width: 100%; max-width: 400px; height: 100vh; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        
        .screen { display: none; width: 100%; text-align: center; animation: fadeIn 0.5s ease-out; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ステージ00: ボタンをガタガタさせない設定 */
        .shelf-grid { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 300px; margin: 30px auto; }
        .shelf-btn { background: transparent; border: 1px solid #444; color: var(--text); padding: 20px; border-radius: 8px; cursor: pointer; transition: 0.3s; width: 100%; box-sizing: border-box; font-size: 1rem; }
        .shelf-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(212, 175, 55, 0.1); }

        /* ステージ01: 中央配置の徹底 */
        .swipe-container { position: relative; width: 300px; height: 400px; margin: 0 auto; display: flex; justify-content: center; align-items: center; }
        .card { position: absolute; width: 100%; height: 100%; background: #1a1a1a; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; border: 1px solid #333; transition: transform 0.3s ease-out, opacity 0.3s; }
        .card img { max-width: 100%; max-height: 250px; object-fit: contain; margin-bottom: 20px; }

        /* 診断結果画面 */
        .res-img { width: 100%; max-width: 250px; border-radius: 10px; margin-bottom: 20px; }
        .review-box { background: #1a1a1a; padding: 15px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 20px; line-height: 1.6; border-left: 3px solid var(--accent); text-align: left; }
        .main-btn { display: block; width: 100%; padding: 15px; background: var(--accent); color: #000; text-decoration: none; border-radius: 30px; font-weight: bold; margin-top: 10px; box-sizing: border-box; }
        
        /* 広告エリア */
        .ad-container { margin: 30px auto; padding: 15px; border-top: 1px solid #333; width: 100%; box-sizing: border-box; }
        .ad-banner { max-width: 100%; height: auto; border-radius: 8px; vertical-align: middle; }
        
        .retry-link { display: inline-block; margin-top: 30px; color: #888; text-decoration: none; padding: 10px 20px; border: 1px solid #333; border-radius: 20px; font-size: 0.8rem; }
    </style>
</head>
<body>

<div id="app">
    <div id="step0" class="screen active">
        <h1 style="color: var(--accent); font-size: 1.5rem;">今の気分で選ぶ</h1>
        <div class="shelf-grid">
            <button class="shelf-btn" onclick="startSwipe('minimal')">清潔感・シンプル</button>
            <button class="shelf-btn" onclick="startSwipe('luxury')">高級感・重厚</button>
            <button class="shelf-btn" onclick="startSwipe('art')">個性的・芸術的</button>
        </div>
    </div>

    <div id="step1" class="screen">
        <div id="card-area" class="swipe-container"></div>
        <div style="margin-top: 30px; display: flex; gap: 40px; justify-content: center;">
            <button onclick="swipe(false)" style="background:none; border:2px solid #ff4b2b; color:#ff4b2b; border-radius:50%; width:60px; height:60px; font-size:1.5rem;">✕</button>
            <button onclick="swipe(true)" style="background:none; border:2px solid #00ff87; color:#00ff87; border-radius:50%; width:60px; height:60px; font-size:1.5rem;">○</button>
        </div>
    </div>

    <div id="step2" class="screen">
        <h2 id="q-text" style="font-size: 1.2rem; margin-bottom: 30px;"></h2>
        <div class="shelf-grid" id="q-options"></div>
    </div>

    <div id="result-screen" class="screen" style="overflow-y: auto; height: 100vh; padding-top: 40px;">
        <div id="res-content"></div>
    </div>
</div>

<script src="data.js"></script>
<script>
    let currentStyle = '';
    let swipeList = [];
    let likedIds = [];
    let userTraits = { clean: 0, luxury: 0, power: 0 };
    let questionIndex = 0;

    const questions = [
        { text: "休日の理想の過ごし方は？", options: [
            { text: "静かなカフェで読書", trait: "clean" },
            { text: "一流ホテルのラウンジ", trait: "luxury" },
            { text: "ジムでハードなトレーニング", trait: "power" }
        ]},
        { text: "今の仕事に求めているものは？", options: [
            { text: "効率と誠実さ", trait: "clean" },
            { text: "品格とステータス", trait: "luxury" },
            { text: "圧倒的な成果", trait: "power" }
        ]}
    ];

    function nextScreen(hide, show) {
        document.getElementById(hide).classList.remove('active');
        document.getElementById(show).classList.add('active');
    }

    function startSwipe(style) {
        currentStyle = style;
        swipeList = masterPerfumes.filter(p => p.style === style);
        renderCard();
        nextScreen('step0', 'step1');
    }

    function renderCard() {
        const area = document.getElementById('card-area');
        area.innerHTML = '';
        if (swipeList.length === 0) {
            startQuiz();
            return;
        }
        const p = swipeList[0];
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<img src="${p.img}"><p>${p.name}</p>`;
        area.appendChild(card);
    }

    function swipe(liked) {
        const p = swipeList.shift();
        if (liked) likedIds.push(p.id);
        renderCard();
    }

    function startQuiz() {
        nextScreen('step1', 'step2');
        showQuestion();
    }

    function showQuestion() {
        if (questionIndex >= questions.length) {
            showResult();
            return;
        }
        const q = questions[questionIndex];
        document.getElementById('q-text').innerText = q.text;
        const optArea = document.getElementById('q-options');
        optArea.innerHTML = '';
        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'shelf-btn';
            btn.innerText = opt.text;
            btn.onclick = () => { userTraits[opt.trait]++; questionIndex++; showQuestion(); };
            optArea.appendChild(btn);
        });
    }

    function showResult() {
        nextScreen('step2', 'result-screen');
        let topTrait = Object.keys(userTraits).reduce((a, b) => userTraits[a] > userTraits[b] ? a : b);
        let result = masterPerfumes.find(p => likedIds.includes(p.id) && p.type === topTrait);
        if (!result) result = masterPerfumes.find(p => p.id === likedIds[0]);
        if (!result) result = masterPerfumes[0];

        let adHtml = '';
        if (result.coloria_url && result.coloria_url !== "") {
            adHtml = `
                <div class="ad-container">
                    <p style="font-size:0.7rem; color:var(--accent); margin-bottom:10px;">── TRIAL SET ──</p>
                    <a href="${result.coloria_url}" rel="nofollow" referrerpolicy="no-referrer-when-downgrade">
                        <img src="//image.moshimo.com/af-img/1708/000000029950.jpg" width="320" height="100" class="ad-banner">
                    </a>
                    <p style="font-size:0.6rem; color:#555; margin-top:10px;">※本ページはプロモーションが含まれています</p>
                </div>
            `;
        }

        let reviewBtn = '';
        if (result.review_url && result.review_url !== "") {
            reviewBtn = `<a href="${result.review_url}" class="main-btn" style="background:transparent; border:1px solid var(--accent); color:var(--accent);">マニアの1200字徹底レビューを読む</a>`;
        }

        document.getElementById('res-content').innerHTML = `
            <img src="${result.img}" class="res-img">
            <h2 style="font-size:1.5rem; margin:0 0 10px;">${result.name}</h2>
            <div class="review-box">${result.quote}</div>
            ${reviewBtn}
            <a href="https://www.google.com/search?q=${encodeURIComponent(result.name)}+香水" target="_blank" class="main-btn">この香水を詳しく調べる</a>
            ${adHtml}
            <p><a href="javascript:location.reload()" class="retry-link">最初から占う</a></p>
        `;
    }
</script>
</body>
</html>
