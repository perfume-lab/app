<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香水診断アプリ</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f8f9fa; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        #app-container { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 500px; text-align: center; }
        .progress-bar { height: 8px; background: #eee; border-radius: 4px; margin-bottom: 2rem; overflow: hidden; }
        .progress-fill { height: 100%; background: #007bff; width: 0%; transition: width 0.3s; }
        .question-step { display: none; }
        .active { display: block; }
        h2 { font-size: 1.2rem; margin-bottom: 1.5rem; }
        .options { display: grid; gap: 10px; }
        .opt-btn { padding: 12px; border: 2px solid #eee; border-radius: 8px; cursor: pointer; transition: all 0.2s; background: white; }
        .opt-btn:hover { border-color: #007bff; background: #f0f7ff; }
        .opt-btn.selected { background: #007bff; color: white; border-color: #007bff; }
        #result-area { display: none; text-align: left; }
        .perfume-card { border-bottom: 1px solid #eee; padding: 1rem 0; }
        .perfume-card:last-child { border: none; }
        .match-score { color: #007bff; font-weight: bold; font-size: 1.1rem; }
        .tag { display: inline-block; background: #e9ecef; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; margin-right: 5px; margin-top: 5px; }
        button#restart { margin-top: 2rem; width: 100%; padding: 10px; background: #333; color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

<div id="app-container">
    <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>
    
    <div id="questions">
        </div>

    <div id="result-area">
        <h3>診断結果：あなたにぴったりの香水</h3>
        <div id="perfume-list"></div>
        <button id="restart" onclick="restart()">もう一度診断する</button>
    </div>
</div>

<script>
    const questions = [
        { q: "利用シーンは？", opts: ["仕事・オフィス", "デート・特別な日", "日常・普段使い", "夜・パーティー"], vals: [1, 5, 3, 4] },
        { q: "香りの強さの好みは？", opts: ["ほのかに", "自分がわかる程度", "周りにも届く", "存在感のある強め"], vals: [1, 3, 4, 5] },
        { q: "甘さは？", opts: ["さっぱり派", "どちらでも", "甘めが好き"], vals: [1, 3, 5] },
        { q: "雰囲気は？", opts: ["華やか・明るい", "どちらでも", "落ち着いた・静か"], vals: [1, 3, 5] },
        { q: "大人度は？", opts: ["若々しく", "どちらでも", "大人っぽく"], vals: [1, 3, 5] }
    ];

    const perfumes = [
        { name: "Dior Sauvage", tags: ["ワイルド", "セクシー"], scores: [3, 5, 2, 2, 4], desc: "野性的で都会的な、力強い男性像を演出します。" },
        { name: "LV Imagination", tags: ["紅茶", "上品"], scores: [5, 3, 3, 1, 5], desc: "最高級のシトラスティー。清潔感と高級感が共存します。" },
        { name: "Creed Aventus", tags: ["王者", "フルーティー"], scores: [5, 4, 2, 1, 5], desc: "圧倒的な自信。パイナップルと燻したような深み。" },
        { name: "Jo Malone English Pear", tags: ["定番", "爽やか"], scores: [3, 2, 3, 1, 3], desc: "誰からも愛される洋梨とフリージアの香り。" },
        { name: "Orpheon", tags: ["ミステリアス", "パウダリー"], scores: [2, 3, 4, 5, 4], desc: "伝説のバーの記憶。石鹸とタバコの煙のような深み。" }
    ];

    let currentStep = 0;
    let userAnswers = [];

    function init() {
        const qArea = document.getElementById("questions");
        questions.forEach((step, idx) => {
            let html = `<div id="step-${idx}" class="question-step ${idx === 0 ? 'active' : ''}">
                <h2>${step.q}</h2>
                <div class="options">`;
            step.opts.forEach((opt, oIdx) => {
                html += `<button class="opt-btn" onclick="answer(${idx}, ${step.vals[oIdx]})">${opt}</button>`;
            });
            html += `</div></div>`;
            qArea.innerHTML += html;
        });
    }

    function answer(stepIdx, val) {
        userAnswers[stepIdx] = val;
        const btns = document.querySelectorAll(`#step-${stepIdx} .opt-btn`);
        btns.forEach(b => b.classList.remove('selected'));
        event.target.classList.add('selected');

        setTimeout(() => {
            document.getElementById(`step-${stepIdx}`).classList.remove('active');
            if (stepIdx + 1 < questions.length) {
                currentStep++;
                document.getElementById(`step-${stepIdx + 1}`).classList.add('active');
                updateProgress();
            } else {
                showResult();
            }
        }, 300);
    }

    function updateProgress() {
        const percent = (currentStep / questions.length) * 100;
        document.getElementById("progress").style.width = percent + "%";
    }

    function showResult() {
        document.getElementById("progress").style.width = "100%";
        document.getElementById("questions").style.display = "none";
        document.getElementById("result-area").style.display = "block";

        let results = perfumes.map(p => {
            let diff = 0;
            p.scores.forEach((s, i) => diff += Math.abs(s - userAnswers[i]));
            let match = Math.max(0, 100 - (diff * 5));
            return { ...p, match };
        }).sort((a, b) => b.match - a.match);

        const list = document.getElementById("perfume-list");
        results.slice(0, 3).forEach(r => {
            list.innerHTML += `
                <div class="perfume-card">
                    <div class="match-score">マッチ度：${r.match}%</div>
                    <strong>${r.name}</strong><br>
                    ${r.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                    <div style="font-size:0.9rem; margin-top:5px; color:#666;">${r.desc}</div>
                </div>
            `;
        });
    }

    function restart() {
        location.reload();
    }

    init();
</script>

</body>
</html>
