<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfume Diagnosis - 香水診断</title>
    <style>
        /* 全体の設定：上質なグレーとベージュのグラデーション */
        body { 
            font-family: 'Times New Roman', "Yu Mincho", "MS Mincho", serif; 
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); 
            color: #2c3e50; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }

        /* コンテナ：ミニマルな高級感を演出 */
        #app-container { 
            background: white; 
            padding: 3rem 2rem; 
            border-radius: 2px; /* あえて角を丸くせずシャープに */
            box-shadow: 0 20px 50px rgba(0,0,0,0.05); 
            width: 90%; 
            max-width: 450px; 
            text-align: center;
            border-top: 4px solid #c5a059; /* 上部にゴールドのアクセント */
        }

        /* 進捗バー：細く繊細に */
        .progress-bar { height: 2px; background: #eee; margin-bottom: 3rem; }
        .progress-fill { height: 100%; background: #c5a059; width: 0%; transition: width 0.5s; }

        .question-step { display: none; }
        .active { display: block; animation: fadeIn 0.8s; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h2 { font-size: 1.1rem; font-weight: normal; letter-spacing: 0.15em; margin-bottom: 2rem; color: #1a1a1a; }

        /* ボタン：モードブランドのようなタイポグラフィ */
        .options { display: grid; gap: 15px; }
        .opt-btn { 
            padding: 15px; 
            border: 1px solid #d1d1d1; 
            border-radius: 0; 
            cursor: pointer; 
            transition: all 0.3s; 
            background: white; 
            font-family: inherit;
            letter-spacing: 0.1em;
            font-size: 0.85rem;
            color: #555;
        }
        .opt-btn:hover { border-color: #c5a059; background: #fafafa; color: #c5a059; }
        .opt-btn.selected { background: #c5a059; color: white; border-color: #c5a059; }

        /* 結果画面：ギャラリーのようなレイアウト */
        #result-area { display: none; text-align: left; }
        #result-area h3 { font-weight: normal; text-align: center; letter-spacing: 0.2em; border-bottom: 1px solid #eee; padding-bottom: 1rem; margin-bottom: 2rem; }
        
        .perfume-card { margin-bottom: 2.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid #f0f0f0; }
        .match-score { color: #c5a059; font-size: 0.8rem; letter-spacing: 0.1em; margin-bottom: 5px; }
        .perfume-name { font-size: 1.2rem; font-weight: bold; display: block; margin-bottom: 8px; color: #111; }
        
        .tag { display: inline-block; border: 1px solid #ddd; padding: 2px 10px; font-size: 0.7rem; margin-right: 5px; color: #888; text-transform: uppercase; }
        .desc { font-size: 0.85rem; color: #666; margin-top: 10px; line-height: 1.6; }

        button#restart { 
            margin-top: 2rem; width: 100%; padding: 12px; background: #1a1a1a; color: white; 
            border: none; cursor: pointer; letter-spacing: 0.2em; font-size: 0.8rem; transition: opacity 0.3s;
        }
        button#restart:hover { opacity: 0.8; }
    </style>
</head>
<body>

<div id="app-container">
    <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>
    
    <div id="questions"></div>

    <div id="result-area">
        <h3>DIAGNOSIS RESULT</h3>
        <div id="perfume-list"></div>
        <button id="restart" onclick="restart()">RETRIAL</button>
    </div>
</div>

<script>
    const questions = [
        { q: "SCENE", opts: ["OFFICE", "ROMANTIC", "CASUAL", "PARTY"], vals: [1, 5, 3, 4] },
        { q: "INTENSITY", opts: ["SOFT", "MODERATE", "NOTICEABLE", "STRONG"], vals: [1, 3, 4, 5] },
        { q: "SWEETNESS", opts: ["FRESH", "NEUTRAL", "SWEET"], vals: [1, 3, 5] },
        { q: "MOOD", opts: ["BRIGHT", "NEUTRAL", "CALM"], vals: [1, 3, 5] },
        { q: "MATURITY", opts: ["YOUTHFUL", "NEUTRAL", "MATURE"], vals: [1, 3, 5] }
    ];

    const perfumes = [
        { name: "Dior Sauvage", tags: ["Wild", "Sexy"], scores: [3, 5, 2, 2, 4], desc: "野性的で都会的な、力強い男性像を演出します。" },
        { name: "LV Imagination", tags: ["Tea", "Elegant"], scores: [5, 3, 3, 1, 5], desc: "最高級のシトラスティー。清潔感と高級感が共存します。" },
        { name: "Creed Aventus", tags: ["Success", "Fruity"], scores: [5, 4, 2, 1, 5], desc: "圧倒的な自信。パイナップルと燻したような深み。" },
        { name: "Jo Malone English Pear", tags: ["Classic", "Fresh"], scores: [3, 2, 3, 1, 3], desc: "誰からも愛される洋梨とフリージアの香り。" },
        { name: "Orpheon", tags: ["Mysterious", "Powdery"], scores: [2, 3, 4, 5, 4], desc: "伝説のバーの記憶。石鹸とタバコの煙のような深み。" }
    ];

    let currentStep = 0;
    let userAnswers = [];

    function init() {
        const qArea = document.getElementById("questions");
        questions.forEach((step, idx) => {
            let html = `<div id="step-${idx}" class="question-step ${idx === 0 ? 'active' : ''}">
                <h2>${step.q}</h2>
                <div class="options">`;
            step.opts.forEach((opt, oIdx) => {
                html += `<button class="opt-btn" onclick="answer(${idx}, ${step.vals[oIdx]})">${opt}</button>`;
            });
            html += `</div></div>`;
            qArea.innerHTML += html;
        });
    }

    function answer(stepIdx, val) {
        userAnswers[stepIdx] = val;
        const btns = document.querySelectorAll(`#step-${stepIdx} .opt-btn`);
        btns.forEach(b => b.classList.remove('selected'));
        event.target.classList.add('selected');

        setTimeout(() => {
            document.getElementById(`step-${stepIdx}`).classList.remove('active');
            if (stepIdx + 1 < questions.length) {
                currentStep++;
                document.getElementById(`step-${stepIdx + 1}`).classList.add('active');
                updateProgress();
            } else {
                showResult();
            }
        }, 400);
    }

    function updateProgress() {
        const percent = (currentStep / questions.length) * 100;
        document.getElementById("progress").style.width = percent + "%";
    }

    function showResult() {
        document.getElementById("progress").style.width = "100%";
        document.getElementById("questions").style.display = "none";
        document.getElementById("result-area").style.display = "block";

        let results = perfumes.map(p => {
            let diff = 0;
            p.scores.forEach((s, i) => diff += Math.abs(s - userAnswers[i]));
            let match = Math.max(0, 100 - (diff * 5));
            return { ...p, match };
        }).sort((a, b) => b.match - a.match);

        const list = document.getElementById("perfume-list");
        results.slice(0, 3).forEach(r => {
            list.innerHTML += `
                <div class="perfume-card">
                    <div class="match-score">MATCHING ${r.match}%</div>
                    <span class="perfume-name">${r.name}</span>
                    ${r.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                    <div class="desc">${r.desc}</div>
                </div>
            `;
        });
    }

    function restart() { location.reload(); }
    init();
</script>

</body>
</html>
