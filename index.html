<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>至高の香水瓶占い</title>
    <style>
        :root { --accent: #d4af37; --bg: #0d0d0d; }
        body { font-family: 'Hiragino Mincho ProN', serif; background: var(--bg); color: #e0e0e0; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: auto; }
        .bottle-option { background: #1a1a1a; border: 1px solid #333; padding: 20px; cursor: pointer; transition: 0.3s; margin-bottom: 20px; }
        .bottle-option:hover { border-color: var(--accent); }
        .bottle-option img { width: 100%; height: 200px; object-fit: contain; }
        .btn { background: var(--accent); color: #000; padding: 15px; width: 100%; border: none; font-weight: bold; cursor: pointer; }
        #result-screen { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="step1">
        <p style="color:var(--accent); letter-spacing:0.2em;">ROUND 1</p>
        <h2>どちらの「佇まい」に惹かれますか？</h2>
        <div id="pair-container"></div>
    </div>

    <div id="step2" style="display:none;">
        <p style="color:#ff4444; letter-spacing:0.2em;">NEGATIVE CHECK</p>
        <h2>「これは自分とは違う」と思うのは？</h2>
        <div id="hate-container"></div>
    </div>

    <div id="result-screen">
        <p style="color:var(--accent);">YOUR BEST MATCH</p>
        <div id="res-content"></div>
        <a href="#" id="res-link" class="btn" style="display:inline-block; text-decoration:none; margin-top:20px;">Celesで詳細を見る</a>
    </div>
</div>

<script>
    const perfumes = [
        { id: 0, name: 'ブルガリ プールオム', img: 'Bvlgari-Pour-Homme-min.png', type: 'clean', quote: '誰からも愛される清潔感の権威。', link: 'https://www.celes-perfume.com/product/bvlgari-bvlgari-pour-homme/' },
        { id: 1, name: 'LV イマジナシオン', img: 'Imagination-min-1.png', type: 'luxury', quote: '上品な紅茶と、ハイブランドの気品。', link: 'https://www.celes-perfume.com/product/louis-vuitton-imagination/' },
        { id: 2, name: 'Dior ソヴァージュ', img: 'dior-sauvage-min.png', type: 'power', quote: 'ワイルドで力強い、男の野性味。', link: 'https://www.celes-perfume.com/product/dior-sauvage/' },
        { id: 3, name: 'レイジーサンデーモーニング', img: 'replica-lazy-sunday-morning-min.png', type: 'clean', quote: '洗い立てのシーツのような透明感。', link: 'https://www.celes-perfume.com/product/maison-margiela-lazy-sunday-morning/' }
    ];

    let likedIds = [];
    let hatedType = "";

    // ROUND 1: 2つのペアから好きな方を選ばせる
    function startStep1() {
        const container = document.getElementById('pair-container');
        // 0番と1番を戦わせる
        [perfumes[0], perfumes[1]].forEach(p => {
            const div = createCard(p, () => {
                likedIds.push(p.id);
                startStep1Round2();
            });
            container.appendChild(div);
        });
    }

    function startStep1Round2() {
        const container = document.getElementById('pair-container');
        container.innerHTML = '<h2>第2ラウンド</h2>';
        // 2番と3番を戦わせる
        [perfumes[2], perfumes[3]].forEach(p => {
            const div = createCard(p, () => {
                likedIds.push(p.id);
                goToStep2();
            });
            container.appendChild(div);
        });
    }

    function goToStep2() {
        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = 'block';
        const container = document.getElementById('hate-container');
        // 全4つの中から嫌いなタイプを1つ選ばせる
        perfumes.forEach(p => {
            const div = createCard(p, () => {
                hatedType = p.type;
                showResult();
            });
            container.appendChild(div);
        });
    }

    function createCard(p, callback) {
        const div = document.createElement('div');
        div.className = 'bottle-option';
        div.innerHTML = `<img src="${p.img}"><p>${p.name}</p>`;
        div.onclick = callback;
        return div;
    }

    function showResult() {
        document.getElementById('step2').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        
        // 好きに選ばれた2つのうち、嫌いなタイプじゃない方を優先。両方嫌いなタイプなら最初の1つ。
        const finalId = likedIds.find(id => perfumes[id].type !== hatedType) ?? likedIds[0];
        const res = perfumes[finalId];

        document.getElementById('res-content').innerHTML = `
            <img src="${res.img}" style="width:200px;">
            <h2>${res.name}</h2>
            <p>${res.quote}</p>
        `;
        document.getElementById('res-link').href = res.link;
    }

    startStep1();
</script>
</body>
</html>
