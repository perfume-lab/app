<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香水診断 Pro</title>
    <style>
        :root { --main-bg: #0a0a0a; --accent: #d4af37; --text: #e0e0e0; }
        body { font-family: "Helvetica Neue", Arial, sans-serif; background: var(--main-bg); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        #app { width: 100%; max-width: 400px; height: 100vh; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        
        .screen { display: none; width: 100%; text-align: center; }
        .screen.active { display: block; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* ステージ共通ボタン */
        .shelf-grid { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 300px; margin: 30px auto; }
        .shelf-btn { background: transparent; border: 1px solid #444; color: var(--text); padding: 20px; border-radius: 8px; cursor: pointer; transition: 0.3s; width: 100%; box-sizing: border-box; font-size: 1rem; }
        .shelf-btn:hover { border-color: var(--accent); color: var(--accent); }

        /* ステージ01: ボトル直感セレクト */
        .swipe-container { position: relative; width: 300px; height: 380px; margin: 0 auto; display: flex; justify-content: center; align-items: center; }
        .card { position: absolute; width: 100%; height: 100%; background: #151515; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; border: 1px solid #222; }
        .card img { max-width: 100%; max-height: 320px; object-fit: contain; }

        /* 診断結果画面 */
        .res-img { width: 100%; max-width: 240px; border-radius: 8px; margin-bottom: 20px; }
        .review-box { background: #151515; padding: 18px; border-radius: 8px; font-size: 0.95rem; margin-bottom: 25px; line-height: 1.7; border-left: 3px solid var(--accent); text-align: left; }
        
        /* 徹底レビューボタン */
        .review-btn { display: block; width: 100%; padding: 18px; background: transparent; border: 1px solid var(--accent); color: var(--accent); text-decoration: none; border-radius: 30px; font-weight: bold; margin-bottom: 15px; box-sizing: border-box; text-align: center; }
        
        .retry-link { display: inline-block; margin-top: 30px; color: #666; text-decoration: none; padding: 8px 20px; border: 1px solid #222; border-radius: 20px; font-size: 0.75rem; cursor: pointer; }
    </style>
</head>
<body>

<div id="app">
    <div id="step0" class="screen active">
        <h1 style="color: var(--accent); font-size: 1.4rem; letter-spacing: 0.1em;">今の気分で選ぶ</h1>
        <div class="shelf-grid">
            <button class="shelf-btn" onclick="startSwipe('minimal')">清潔感・シンプル</button>
            <button class="shelf-btn" onclick="startSwipe('luxury')">高級感・重厚</button>
            <button class="shelf-btn" onclick="startSwipe('art')">個性的・芸術的</button>
        </div>
    </div>

    <div id="step1" class="screen">
        <p style="font-size: 0.85rem; color: #888; margin-bottom: 20px;">直感で「好き」なら右へ</p>
        <div id="card-area" class="swipe-container"></div>
        <div style="margin-top: 35px; display: flex; gap: 40px; justify-content: center;">
            <button onclick="swipe(false)" style="background:none; border:1px solid #444; color:#666; border-radius:50%; width:65px; height:65px; font-size:1.2rem; cursor:pointer;">✕</button>
            <button onclick="swipe(true)" style="background:none; border:1px solid var(--accent); color:var(--accent); border-radius:50%; width:65px; height:65px; font-size:1.2rem; cursor:pointer;">○</button>
        </div>
    </div>

    <div id="step2" class="screen">
        <h2 id="q-text" style="font-size: 1.1rem; margin-bottom: 30px; letter-spacing: 0.05em;"></h2>
        <div class="shelf-grid" id="q-options"></div>
    </div>

    <div id="result-screen" class="screen" style="overflow-y: auto; height: 100vh; padding: 40px 20px;">
        <div id="res-content"></div>
    </div>
</div>

    <div class="box" style="background: #fff9e6; border-color: #d4af37; text-align: center;">
    <p style="font-size: 0.9rem; margin-bottom: 15px;"><b>【PR】この香りを試してみたい方へ</b></p>
    
    <center>
      <a href="//af.moshimo.com/af/c/click?a_id=5473106&p_id=2256&pc_id=4820&pl_id=29949" rel="nofollow" referrerpolicy="no-referrer-when-downgrade" attributionsrc><img src="//image.moshimo.com/af-img/1708/000000029949.jpg" width="320" height="100" style="border:none;"></a><img src="//i.moshimo.com/af/i/impression?a_id=5473106&p_id=2256&pc_id=4820&pl_id=29949" width="1" height="1" style="border:none;" loading="lazy">
    </center>
</div>

<script src="data.js"></script>
<script>
    let currentStyle = '';
    let swipeList = [];
    let likedIds = [];
    let userTraits = { clean: 0, luxury: 0, power: 0 };
    let questionIndex = 0;

    const questions = [
        { text: "休日の理想の過ごし方は？", options: [
            { text: "静かなカフェで読書", trait: "clean" },
            { text: "一流ホテルのラウンジ", trait: "luxury" },
            { text: "ジムでハードなトレーニング", trait: "power" }
        ]},
        { text: "仕事におけるスタンスは？", options: [
            { text: "効率と誠実さ", trait: "clean" },
            { text: "品格とステータス", trait: "luxury" },
            { text: "圧倒的な成果", trait: "power" }
        ]}
    ];

    function nextScreen(hide, show) {
        document.getElementById(hide).classList.remove('active');
        document.getElementById(show).classList.add('active');
    }

    function startSwipe(style) {
        currentStyle = style;
        // masterPerfumes は data.js で定義されている前提です
        swipeList = masterPerfumes.filter(p => p.style === style);
        if (swipeList.length === 0) {
            startQuiz();
            return;
        }
        renderCard();
        nextScreen('step0', 'step1');
    }

    function renderCard() {
        const area = document.getElementById('card-area');
        area.innerHTML = '';
        if (swipeList.length === 0) {
            startQuiz();
            return;
        }
        const p = swipeList[0];
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<img src="${p.img}">`;
        area.appendChild(card);
    }

    function swipe(liked) {
        const p = swipeList.shift();
        if (liked) likedIds.push(p.id);
        renderCard();
    }

    function startQuiz() {
        nextScreen('step1', 'step2');
        showQuestion();
    }

    function showQuestion() {
        if (questionIndex >= questions.length) {
            showResult();
            return;
        }
        const q = questions[questionIndex];
        document.getElementById('q-text').innerText = q.text;
        const optArea = document.getElementById('q-options');
        optArea.innerHTML = '';
        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'shelf-btn';
            btn.innerText = opt.text;
            btn.onclick = () => { 
                userTraits[opt.trait]++; 
                questionIndex++; 
                showQuestion(); 
            };
            optArea.appendChild(btn);
        });
    }

    function showResult() {
        nextScreen('step2', 'result-screen');
        let topTrait = Object.keys(userTraits).reduce((a, b) => userTraits[a] > userTraits[b] ? a : b);
        
        let result = masterPerfumes.find(p => likedIds.includes(p.id) && p.type === topTrait);
        if (!result) result = masterPerfumes.find(p => likedIds.includes(p.id));
        if (!result) result = masterPerfumes[0];

        let reviewBtn = '';
        if (result.review_url && result.review_url !== "") {
            reviewBtn = `<a href="${result.review_url}" class="review-btn">マニアの1200字徹底レビューを読む</a>`;
        }

        document.getElementById('res-content').innerHTML = `
            <img src="${result.img}" class="res-img">
            <h2 style="font-size:1.4rem; margin:0 0 15px; color:var(--accent);">${result.name}</h2>
            <div class="review-box">${result.quote}</div>
            
            ${reviewBtn}
            <p><a onclick="location.reload()" class="retry-link">もう一度診断する</a></p>
        `;
    }
</script>
</body>
</html>
