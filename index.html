<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香水診断Pro - あなたにぴったりの香り</title>
    <style>
        :root {
            --main-bg: #fdfcf9;
            --accent: #8e8e8e;
            --text: #333d32;
        }
        body {
            font-family: "游明朝", serif;
            background-color: var(--main-bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            line-height: 1.8;
        }
        #question-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }
        h3 { font-size: 1.2rem; margin-bottom: 30px; }
        .opt-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #e0e0e0;
            background: #fff;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 5px;
            font-family: inherit;
        }
        .opt-btn:hover {
            background: #f5f5f5;
            border-color: #8e8e8e;
        }
        .result-card img {
            width: 100%;
            max-width: 250px;
            height: auto;
            border-radius: 10px;
            margin: 20px 0;
        }
        .quote { font-style: italic; color: #666; margin: 20px 0; font-size: 0.9rem; }
        .detail-btn, .retry-btn {
            display: inline-block;
            padding: 12px 25px;
            margin: 10px 5px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .detail-btn { background: #333; color: #fff; }
        .retry-btn { background: #eee; color: #333; border: none; cursor: pointer; }
        .detail-btn:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <div id="question-container">
        <p>診断を読み込み中...</p>
    </div>

    <script src="data.js"></script>

    <script>
        // 状態管理
        let userTraits = { clean: 0, luxury: 0, power: 0 };
        let questionIndex = 0;

        // 設問データ（4問）
        const questions = [
            { text: "大切にしたい時間は？", options: [
                { text: "朝の爽やかな空気の中での読書", trait: "clean" },
                { text: "夜、お気に入りのバーやディナー", trait: "luxury" },
                { text: "新しい場所への挑戦と刺激", trait: "power" }
            ]},
            { text: "あなたの理想のイメージは？", options: [
                { text: "自然体で、透明感のある印象", trait: "clean" },
                { text: "凛としていて、品格のある印象", trait: "luxury" },
                { text: "個性的で、知性を感じる印象", trait: "power" }
            ]},
            { text: "惹かれる風景はどっち？", options: [
                { text: "雨上がりの静かな森や水辺", trait: "clean" },
                { text: "光が差し込むテラス席", trait: "luxury" },
                { text: "重厚なインテリアが並ぶ書斎", trait: "power" }
            ]},
            { text: "今の直感で選ぶなら？", options: [
                { text: "洗い立ての白いシャツ", trait: "clean" },
                { text: "繊細なゴールドの耳飾り", trait: "luxury" },
                { text: "使い込まれた革のノート", trait: "power" }
            ]}
        ];

        // 起動時に最初の質問を表示
        window.onload = function() {
            showQuestion();
        };

        function showQuestion() {
            const container = document.getElementById('question-container');
            if (questionIndex < questions.length) {
                const q = questions[questionIndex];
                let html = `<h3>${q.text}</h3>`;
                q.options.forEach((opt) => {
                    html += `<button class="opt-btn" onclick="answerQuestion('${opt.trait}')">${opt.text}</button>`;
                });
                container.innerHTML = html;
            } else {
                showResult();
            }
        }

        function answerQuestion(trait) {
            userTraits[trait]++;
            questionIndex++;
            showQuestion();
        }

        function getRecommendedPerfumeId() {
            // スコアが一番高いものを抽出
            let topTrait = Object.keys(userTraits).reduce((a, b) => userTraits[a] > userTraits[b] ? a : b);

            // 13種類を3つの性格にランダム配分
            const candidates = {
                clean: ['nil', 'lazy', 'blanche', 'tacit', '212'],
                luxury: ['english-pear', 'teabreak', 'parade', 'luna', 'lost-cherry'],
                power: ['another13', 'gaiac10', 'imagination']
            };

            const list = candidates[topTrait];
            return list[Math.floor(Math.random() * list.length)];
        }

        function showResult() {
            const perfumeId = getRecommendedPerfumeId();
            // data.js内の masterPerfumes から該当IDを探す
            const perfume = masterPerfumes.find(p => p.id === perfumeId);
            const container = document.getElementById('question-container');

            if (perfume) {
                container.innerHTML = `
                    <div class="result-card">
                        <p style="font-size:0.8rem; letter-spacing:0.1em; color:#8e8e8e;">YOUR MATCH</p>
                        <h2 style="margin:10px 0;">${perfume.name}</h2>
                        <img src="${perfume.img}" alt="${perfume.name}">
                        <p class="quote">"${perfume.quote}"</p>
                        <div style="margin-top:20px;">
                            <a href="${perfume.review_url}" class="detail-btn">詳しく見る</a>
                            <button class="retry-btn" onclick="location.reload()">もう一度診断</button>
                        </div>
                    </div>
                `;
            } else {
                container.innerHTML = `<p>結果の取得に失敗しました。もう一度お試しください。</p>
                                       <button class="retry-btn" onclick="location.reload()">戻る</button>`;
            }
        }
    </script>
</body>
</html>
