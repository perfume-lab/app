<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香水診断Pro - AI精密マッチング</title>
    <style>
        :root { --bg: #fdfcf9; --accent: #8e8e8e; --text: #333d32; --bar: #e0e0e0; }
        body { font-family: "游明朝", serif; background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #app { background: #fff; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 600px; width: 90%; text-align: center; }
        
        /* 進捗バー */
        .progress-container { width: 100%; height: 4px; background: var(--bar); margin-bottom: 30px; border-radius: 2px; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: var(--accent); transition: width 0.3s; }
        
        h3 { font-size: 1.2rem; margin-bottom: 25px; min-height: 3em; display: flex; align-items: center; justify-content: center; color: #1a1a1a; }
        .opt-btn { display: block; width: 100%; padding: 16px; margin: 10px 0; border: 1px solid #eee; background: #fff; cursor: pointer; transition: 0.2s; border-radius: 8px; font-family: inherit; font-size: 1rem; text-align: left; }
        .opt-btn:hover { background: #fafafa; border-color: var(--accent); transform: translateX(5px); }
        
        /* 結果表示 */
        .res-title { font-size: 0.8rem; letter-spacing: 0.2em; color: var(--accent); margin-bottom: 5px; }
        .main-img { width: 100%; max-width: 240px; margin: 20px 0; border-radius: 10px; }
        .type-desc { font-size: 0.9rem; background: #f9f9f9; padding: 20px; border-radius: 10px; margin: 20px 0; text-align: left; line-height: 1.7; }
        .sub-results { display: flex; justify-content: space-around; gap: 10px; margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px; }
        .sub-card { width: 45%; font-size: 0.8rem; }
        .sub-card img { width: 100px; height: auto; border-radius: 5px; }
        .btn-link { display: inline-block; padding: 12px 30px; background: #333; color: #fff; text-decoration: none; border-radius: 5px; margin-top: 15px; }
        .retry-btn { background: none; border: none; color: #999; text-decoration: underline; cursor: pointer; margin-top: 25px; font-size: 0.8rem; }
    </style>
</head>
<body>

<div id="app">診断を準備中...</div>

<script src="data.js"></script>
<script>
/** * v1.1 ロジック設定 
 * 各回答は[Clean, Luxury, Power]のTraitと、
 * [brightness, softness, formality, uniqueness, distance]の補助軸に加点する
 */
const questionPool = [
    { q: "🌿 理想の休日の目覚めは？", opts: [
        { t: "窓を開けて風を通す", s: {clean:1.0, brightness:0.8, softness:0.5} },
        { t: "遮光カーテンの中で微睡む", s: {power:1.0, softness:0.3, distance:0.2} },
        { t: "ホテルのシーツの中で朝食を", s: {luxury:1.0, softness:0.8, formality:0.6} }
    ]},
    { q: "☕ 今、一番惹かれる飲み物は？", opts: [
        { t: "淹れたてのブラックコーヒー", s: {power:1.0, brightness:0.2, formality:0.7} },
        { t: "お気に入りの茶葉のミルクティー", s: {luxury:1.0, softness:0.9, brightness:0.6} },
        { t: "冷たい炭酸水とレモン", s: {clean:1.0, brightness:0.9, distance:0.4} }
    ]},
    { q: "🖼️ 部屋に飾るならどの絵？", opts: [
        { t: "淡い水彩の風景画", s: {clean:1.0, softness:0.8, uniqueness:0.2} },
        { t: "モダンな抽象画", s: {power:1.0, uniqueness:0.9, formality:0.6} },
        { t: "古典的な油彩の肖像画", s: {luxury:1.0, formality:0.9, distance:0.7} }
    ]},
    { q: "🕯️ 惹かれる灯りのトーンは？", opts: [
        { t: "朝の自然な太陽光", s: {clean:1.0, brightness:1.0} },
        { t: "重厚な間接照明", s: {power:0.7, luxury:0.3, distance:0.6} },
        { t: "華やかなシャンデリア", s: {luxury:1.0, brightness:0.8, distance:0.8} }
    ]},
    { q: "📜 大切にしたいモットーは？", opts: [
        { t: "ありのままの自然体", s: {clean:1.0, softness:0.9} },
        { t: "気高く、自分らしく", s: {luxury:1.0, formality:0.7, uniqueness:0.4} },
        { t: "静かな意志と知性", s: {power:1.0, uniqueness:0.7, distance:0.3} }
    ]},
    { q: "👠 今日の靴を選ぶなら？", opts: [
        { t: "清潔感のある白スニーカー", s: {clean:1.0, softness:0.6, brightness:0.8} },
        { t: "手入れされた革靴・ヒール", s: {luxury:0.6, power:0.4, formality:0.9} },
        { t: "デザインの効いたブーツ", s: {power:1.0, uniqueness:0.8} }
    ]},
    { q: "🍷 誰かと過ごす理想の夜は？", opts: [
        { t: "静かなテラスでカクテル", s: {luxury:0.7, clean:0.3, brightness:0.5} },
        { t: "オーセンティックなバー", s: {power:0.8, luxury:0.2, distance:0.7} },
        { t: "家で映画を観ながらリラックス", s: {clean:0.7, softness:1.0} }
    ]},
    { q: "📚 本棚にあると落ち着くのは？", opts: [
        { t: "美しい写真集や画集", s: {luxury:1.0, brightness:0.6} },
        { t: "専門書や哲学書", s: {power:1.0, uniqueness:0.7, formality:0.8} },
        { t: "心温まるエッセイ", s: {clean:1.0, softness:0.8} }
    ]},
    { q: "🧥 アウターの手触りは？", opts: [
        { t: "柔らかなカシミヤ", s: {luxury:1.0, softness:1.0, distance:0.4} },
        { t: "張りのあるコットン", s: {clean:1.0, brightness:0.7, formality:0.5} },
        { t: "重厚なウールやレザー", s: {power:1.0, formality:0.8, uniqueness:0.6} }
    ]},
    { q: "💎 アクセサリーを一つ選ぶなら？", opts: [
        { t: "繊細なシルバーのリング", s: {clean:1.0, brightness:0.7, distance:0.2} },
        { t: "存在感のあるゴールド", s: {luxury:1.0, distance:0.8, brightness:0.6} },
        { t: "ヴィンテージの一点物", s: {power:1.0, uniqueness:1.0} }
    ]}
    // ※ 実際はここにさらに20問ほど追加してランダム性を高めます
];

// 香水側の補助軸データ（マッチング用）
const perfumeMetrics = {
    nil: {b:0.9, s:0.6, f:0.4, u:0.2, d:0.5},
    lazy: {b:0.8, s:0.9, f:0.2, u:0.3, d:0.4},
    blanche: {b:1.0, s:0.7, f:0.5, u:0.2, d:0.6},
    tacit: {b:0.6, s:0.4, f:0.7, u:0.6, d:0.4},
    '212': {b:0.7, s:0.3, f:0.8, u:0.4, d:0.6},
    'english-pear': {b:0.8, s:0.7, f:0.6, u:0.3, d:0.5},
    teabreak: {b:0.7, s:0.9, f:0.4, u:0.4, d:0.4},
    parade: {b:0.6, s:0.5, f:0.9, u:0.5, d:0.7},
    luna: {b:0.5, s:0.6, f:0.7, u:0.6, d:0.5},
    'lost-cherry': {b:0.2, s:0.4, f:0.8, u:0.9, d:0.9},
    another13: {b:0.4, s:0.5, f:0.4, u:1.0, d:0.6},
    gaiac10: {b:0.3, s:0.6, f:0.6, u:0.8, d:0.3},
    imagination: {b:0.7, s:0.4, f:0.7, u:0.7, d:0.6}
};

let currentIdx = 0;
let userScores = { clean:0, luxury:0, power:0, b:0, s:0, f:0, u:0, d:0 };
let sessionQuestions = [];

window.onload = () => {
    // プールから10問(今回は例として10問)を抽出してシャッフル
    sessionQuestions = questionPool.sort(() => Math.random() - 0.5).slice(0, 10);
    render();
};

function render() {
    const app = document.getElementById('app');
    const progress = (currentIdx / sessionQuestions.length) * 100;
    
    if (currentIdx < sessionQuestions.length) {
        const q = sessionQuestions[currentIdx];
        app.innerHTML = `
            <div class="progress-container"><div id="progress-bar" style="width:${progress}%"></div></div>
            <div class="progress">Step ${currentIdx + 1} / ${sessionQuestions.length}</div>
            <h3>${q.q}</h3>
            ${q.opts.map((o, i) => `<button class="opt-btn" onclick="next(${i})">${o.t}</button>`).join('')}
        `;
    } else {
        showResult();
    }
}

function next(optIdx) {
    const scores = sessionQuestions[currentIdx].opts[optIdx].s;
    for (let key in scores) { userScores[key] += scores[key]; }
    currentIdx++;
    render();
}

function showResult() {
    const app = document.getElementById('app');
    
    // 主属性決定
    const trait = ['clean', 'luxury', 'power'].reduce((a, b) => userScores[a] > userScores[b] ? a : b);
    
    // 補助軸の平均化
    const userV = {
        b: userScores.b / currentIdx,
        s: userScores.s / currentIdx,
        f: userScores.f / currentIdx,
        u: userScores.u / currentIdx,
        d: userScores.d / currentIdx
    };

    // 候補をTraitで絞り、補助軸の距離（ユークリッド距離）でソート
    const candidates = masterPerfumes.filter(p => {
        // IDによってTraitを割り振り
        const map = {
            clean: ['nil', 'lazy', 'blanche', 'tacit', '212'],
            luxury: ['english-pear', 'teabreak', 'parade', 'luna', 'lost-cherry'],
            power: ['another13', 'gaiac10', 'imagination']
        };
        return map[trait].includes(p.id);
    });

    const sorted = candidates.map(p => {
        const pv = perfumeMetrics[p.id];
        const dist = Math.sqrt(
            Math.pow(userV.b - pv.b, 2) + Math.pow(userV.s - pv.s, 2) +
            Math.pow(userV.f - pv.f, 2) + Math.pow(userV.u - pv.u, 2) + Math.pow(userV.d - pv.d, 2)
        );
        return { ...p, dist };
    }).sort((a, b) => a.dist - b.dist);

    const best = sorted[0];
    const sub1 = sorted[1];
    const sub2 = sorted[2];

    const typeDesc = {
        clean: "あなたは「強く印象を残す」よりも、「近づいたときに感じる清潔感」や「空気の整った人」という印象を大切にするタイプです。今回の回答では、透明感や柔らかさのスコアが高く出ました。",
        luxury: "あなたは、ただ無難なだけではなく、気品や高揚感、自分を少し美しく見せてくれる空気感を求めるタイプです。今回の回答では、華やかさや特別感のスコアが強く出ました。",
        power: "あなたは、分かりやすい甘さや親しみやすさよりも、知性・静かな意志・都会的な個性に惹かれるタイプです。今回の回答では、モダンさや一癖ある印象が高く出ました。"
    };

    app.innerHTML = `
        <div class="result-card">
            <div class="res-title">PERFECT MATCH</div>
            <h2 style="margin:5px 0 20px 0;">${best.name}</h2>
            <img src="${best.img}" class="main-img">
            <div class="type-desc">
                <strong>診断結果：${trait.toUpperCase()} タイプ</strong><br><br>
                ${typeDesc[trait]}<br><br>
                その中でも、あなたの補助軸スコアに最も近い「${best.name}」を本命として選出しました。
            </div>
            <a href="${best.review_url}" class="btn-link">詳細・分析データを読む</a>
            
            <div class="sub-results">
                <div class="sub-card">
                    <p style="color:#999; font-size:0.7rem;">OTHER OPTION 01</p>
                    <img src="${sub1.img}">
                    <p><strong>${sub1.name}</strong></p>
                    <a href="${sub1.review_url}" style="color:#333; text-decoration:none;">→詳細</a>
                </div>
                <div class="sub-card">
                    <p style="color:#999; font-size:0.7rem;">OTHER OPTION 02</p>
                    <img src="${sub2.img}">
                    <p><strong>${sub2.name}</strong></p>
                    <a href="${sub2.review_url}" style="color:#333; text-decoration:none;">→詳細</a>
                </div>
            </div>
            <button class="retry-btn" onclick="location.reload()">別の質問で再診断する</button>
        </div>
    `;
}
</script>
</body>
</html>
